<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tabs fixture</title></head>
<body>
<main id="app">
  <button id="load" type="button">Load</button>
  <div id="slot"></div>
</main>
<script>
  // Simulates an async fetch: content appears 300 ms after the click.
  document.getElementById("load").addEventListener("click", () => {
    setTimeout(() => {
      document.getElementById("slot").innerHTML = '<table id="result"><tbody><tr><td>ready</td></tr></tbody></table>';
    }, 300);
  });
</script>
</body></html>
