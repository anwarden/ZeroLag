<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Busy fixture</title></head>
<body>
<button id="busy" type="button">Busy</button>
<p id="out"></p>
<script>
  // Blocks the main thread for 150 ms inside the click handler, then renders.
  document.getElementById("busy").addEventListener("click", () => {
    const end = performance.now() + 150;
    while (performance.now() < end) {}
    document.getElementById("out").innerHTML = '<span id="done">done</span>';
  });
</script>
</body></html>
