name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = macOS system Python; the scripts must keep running there.
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m unittest discover -s tests -v

  browser:
    name: Browser and journey timer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Playwright outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.0
          npx --no playwright install --with-deps chromium
      - name: Browser rendering and timing tests
        env:
          ZEROLAG_PLAYWRIGHT_FROM: ${{ runner.temp }}/pw
        run: python -m unittest tests.test_report_browser tests.test_journey_timer -v

  sql:
    name: Documented SQL on PostgreSQL 17
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Enable pg_stat_statements
        env:
          PGURL: postgresql://postgres@localhost:5432/postgres
        run: |
          psql "$PGURL" -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          psql "$PGURL" -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
      - name: Read-only SQL catalog
        env:
          ZEROLAG_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          ZEROLAG_REQUIRE_PG_STAT_STATEMENTS: "1"
        run: python -m unittest tests.test_sql_catalog -v
